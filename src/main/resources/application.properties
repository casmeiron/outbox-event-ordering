quarkus.application.name=ordered-outbox

# Dev Services supplies Postgres and Kafka for `quarkus:dev` and tests.
# The prod profile below is what docker compose uses.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true

quarkus.kafka.devservices.topic-partitions.order-events=6
quarkus.kafka.devservices.topic-partitions.order-events-dlq=1

mp.messaging.outgoing.order-events-out.connector=smallrye-kafka
mp.messaging.outgoing.order-events-out.topic=order-events
mp.messaging.outgoing.order-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-events-out.partitions=6
mp.messaging.outgoing.order-events-out.acks=all
mp.messaging.outgoing.order-events-out.enable.idempotence=true
# One in-flight request keeps a single producer's send order. Aggregate keys
# still matter once more than one publisher process is sending.
mp.messaging.outgoing.order-events-out.max.in.flight.requests.per.connection=1

mp.messaging.incoming.order-events-in.connector=smallrye-kafka
mp.messaging.incoming.order-events-in.topic=order-events
mp.messaging.incoming.order-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.group.id=order-projection
mp.messaging.incoming.order-events-in.auto.offset.reset=earliest
mp.messaging.incoming.order-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events-in.dead-letter-queue.topic=order-events-dlq
mp.messaging.incoming.order-events-in.commit-strategy=throttled

# safe | naive. Startup default; PUT /admin/mode flips it at runtime for the demo.
outbox.mode=${OUTBOX_MODE:safe}
outbox.shards=32
outbox.workers=4
outbox.poll-interval=50ms
outbox.claim-lease=60s
# How many business events an aggregate emits. Naive async apply waits longer
# for lower versions so a gap in scheduling cannot hide the race.
outbox.pipeline-depth=3
outbox.naive.tick-size=128
outbox.naive.stall-lower-versions=true
outbox.naive.async-consumer=true
outbox.naive.consumer-step-delay=200ms
outbox.safe.batch-size=16
outbox.publisher.auto-start=true

quarkus.log.category."io.orderedoutbox".level=INFO

%prod.quarkus.datasource.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:orders}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:orders}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/orders}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

%test.quarkus.banner.enabled=false
%test.outbox.poll-interval=20ms
%test.quarkus.log.category."org.apache.kafka".level=WARN
%test.quarkus.log.category."org.hibernate".level=WARN
%test.quarkus.log.category."io.smallrye".level=WARN
